services:
  app:
    build: .
    command: ["gradle", "--no-daemon", "--console=plain", "bootRun"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/car_rental
      SPRING_DATASOURCE_USERNAME: car_rental
      SPRING_DATASOURCE_PASSWORD: car_rental_local
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 60s
    volumes:
      - .:/workspace
      - gradle-cache:/root/.gradle

  db:
    image: postgres:18.6
    environment:
      POSTGRES_DB: car_rental
      POSTGRES_PASSWORD: car_rental_local
      POSTGRES_USER: car_rental
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./src/main/resources/db/init:/docker-entrypoint-initdb.d:ro

  adminer:
    image: adminer:6.2.0-standalone
    depends_on:
      db:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "127.0.0.1:8081:8080"

  test:
    build: .
    command: ["gradle", "--no-daemon", "--console=plain", "--project-cache-dir", "/tmp/car-rental-gradle-project", "test"]
    profiles: ["test"]
    environment:
      DOCKER_HOST: unix:///var/run/docker.sock
      TESTCONTAINERS_HOST_OVERRIDE: host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/workspace
      - gradle-cache:/root/.gradle
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  gradle-cache:
  postgres-data:
